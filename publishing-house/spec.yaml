  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: classic
  intake_type: new
  automation_type: gitops
  description: 'Participants build a multi-step agent on OpenShift AI one layer at a time. Each
    layer opens with the way that layer commonly breaks, diagnosed from the request and response
    payloads on the inference endpoint, and closes with the build step that prevents it: a serving
    runtime configured so tool calls are parsed at all, a loop that stops on the model''s reported
    stop condition, tool returns that surface failure instead of hiding it, a searchable knowledge
    source, and governed tool access through the platform.'
  jira_ticket: RHDPCD-1073
  workflow_id: ae352eec-d9fb-4849-b96e-cf7a6a4cf4dc
spec:
  title: 'Building an Agent on OpenShift AI: Each Step, and How It Breaks First'
  learning_objectives:
  - Deploy a vLLM serving runtime on OpenShift AI configured so that a model's tool calls are
    emitted and parsed rather than stranded as text in the response body.
  - Analyze the request and response payloads on an inference endpoint to determine whether
    a tool call was emitted, parsed, or silently discarded.
  - Troubleshoot an agent that never calls a tool by comparing the endpoint's serving arguments
    against the tool-call format the model was trained to produce.
  - Build an agent loop that terminates on the model's reported stop condition rather than on
    a text heuristic, a first response, or an iteration cap.
  - Implement a structured tool-error contract of category, retryable flag and detail so that
    failed tool calls surface instead of becoming confident empty answers.
  - Integrate a searchable knowledge source so the agent grounds its answers in retrieved content
    rather than in model memory.
  - Configure tool access through MCP Gateway so the agent reaches its tools by a governed path
    rather than by direct connection.
  - Verify the assembled agent end to end against the failure cases from every earlier step
    before treating it as more than a prototype.
  modules:
  - id: module-01
    title: What you are building, and how to see inside it
    duration_min: 12
    status: not_started
  - id: module-02
    title: 'The model interface: making tool calls fire at all'
    duration_min: 22
    status: not_started
  - id: module-03
