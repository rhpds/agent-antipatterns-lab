    duration_min: 13
    status: not_started
  environment:
    platform: ocp
    topology: shared-cluster
    cloud_provider: aws
    max_concurrent_users: 30
    ocp_version: '4.20'
    cluster_type: multinode
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 6
    worker_cpu: 16
    worker_ram_gb: 64
    worker_disk_gb: 200
    vms_per_student: []
    aap_version: ''
    ai_requirement: gpu
    ai_model_tier: open-source
    ai_model_name: RedHatAI/Qwen3-8B-FP8-dynamic
    ai_justification: 'MaaS cannot satisfy this lab. Module 2''s mechanic is comparing two serving
      configurations of the same model, one with a mismatched tool-call parser and one with
      the validated recipe. A hosted chat API exposes no serving configuration, so the module
      has no failure to diagnose and no fix to apply. Self-hosted vLLM is therefore required.
      This is also what separates the design from the other candidates in this topic slot, all
      of which consume a centrally hosted model. L40S specifically, not A100: the model is an
      FP8 checkpoint, and native FP8 compute (W8A8) requires compute capability 8.9 or later,
      meaning Ada Lovelace or Hopper. On Ampere (A100, SM80) vLLM does not fail, it silently
      falls back to weight-only W8A16 via FP8 Marlin, dequantizing to 16-bit before the tensor
      cores. That yields the memory saving and none of the FP8 throughput, which is an indefensible
      trace for a lab whose subject is serving configuration. Sizing is a throughput question,
      not a memory one: after module 2 the whole room repoints to the validated endpoint, so
      peak concurrent generation lands there. Four GPUs map one vLLM instance per GPU, the broken
      endpoint on GPU 0 and three validated replicas on GPUs 1-3, which avoids per-instance
      gpu_memory_utilization fractions entirely and keeps the failure domain per-endpoint. Published
      benchmarks show Qwen3-8B sustaining 256 concurrent requests on a single A10G with no dropped
      requests; L40S is materially faster with native FP8, so 30 concurrent participants across
      three replicas carries substantial headroom.'
    non_ga_products:
    - MCP Gateway - Tech Preview via Red Hat Connectivity Link (operator v0.7.1, Red Hat provided)
    non_ga_access_plan: 'One non-GA dependency, down from three in the rejected version. Removing
      the guardrails and adversarial-scanning rounds took EvalHub and Garak off the design entirely.

      MCP Gateway ships inside Red Hat OpenShift AI and installs through the normal operator
      catalog, so no separate entitlement, early-access programme or non-standard registry is
      required. It is supporting rather than load-bearing: module 6 teaches governed tool access
      as a build step and carries no assessed outcome that fails without it. Documented fallback
      if it regresses before the event is tool scoping at the MCP server or registry level plus
      RBAC, which demonstrates the same principle without the gateway dependency.

      The vector store for module 5 is not yet selected and may add a dependency. The requirement
      is modest and the selection should favour whatever RHOAI already ships or GitOps can stand
      up without a new operator. Flagged for the infra reviewer.'
    external_services:
    - registry.redhat.io
    - quay.io
    - huggingface.co
    - github.com
    - pypi.org
    gpu_nodes: 1
    gpu_type: NVIDIA L40S 48GB x4 per node (AWS g6e.12xlarge — 4 GPUs, 48 vCPU, 384GB RAM)
  duration_hours: 2
  audience: intermediate
