# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: >-
      Trust-based and stated explicitly. Classic Showroom with no solve/validate automation
      to author, so completion is not machine-verified. Each of the four rounds instead ends in
      a visible, unambiguous result the participant confirms for themselves, chosen so that it
      does not depend on the model choosing correctly — tool_calls becoming populated where
      tool-call text had been stranded in the response content, the tool catalog shrinking from
      18 to the identity-authorized subset, the swallowed error surfacing as a structured
      failure, and the guardrail returning a blocked verdict for every case in the adversarial
      set. Module 1 confirms environment and trace access; module 6 is discussion-led and
      produces a takeaway artifact rather than a system state.
    catalog_gap: >-
      Eight catalog items score above 50% relevance, but each covers one or two of the four
      platform layers rather than the sequence. The same caveat repeats across the top three
      matches: they teach observability and tracing but not vLLM serving configuration,
      identity-based tool governance, or moving compliance rules into platform enforcement.
      The two highest matches, AgentOps in Production (99%) and LB2144 (93%), both address
      agent quality for a system the participant already owns and understands; this design
      addresses agent failure modes and the platform contract that prevents them, and is
      positioned as the prerequisite to that material rather than a competitor for the same
      slot. Two lower matches overlap at round level rather than lab level: VLLM Playground
      (74%) already teaches tool-calling parsers per model family, which is Round 1 territory,
      and the MCP Registry lab (80%) covers tool access control by allowlist, which is
      adjacent to Round 2's identity-based gateway filtering. No catalog item teaches
      anti-pattern first, and none is structured as diagnose-from-trace then remediate.
    design_overview: >-
      Participants inherit a working agent prototype that demos perfectly and fails on
      realistic input. Across four rounds they diagnose a planted structural anti-pattern from
      an OpenShift AI execution trace, then fix it by applying a supplied configuration to a
      named Red Hat AI component: vLLM tool-calling configuration, MCP Gateway, MLflow Tracing,
      and the TrustyAI Guardrails Orchestrator. Diagnosis is the reasoning work and remediation
      is guided, so the lab stays at Intermediate level for Technical Sellers and Services
      while every round demonstrates real product usage.
    module_summaries:
      - title: "Meet the prototype"
        overview: >-
          Participants inherit an agent prototype that passes its demo input and produces a
          confident, fabricated answer on realistic input. They learn to read an execution
          trace — model turns, tool invocations, tool results, stop conditions — and establish
          the rule the rest of the lab runs on: the final answer is a claim, the trace is the
          evidence. Nothing is fixed here.
      - title: "Round 1 — Loop discipline and tool-calling configuration"
        overview: >-
          Two sequenced beats. First the agent never calls a tool, because the endpoint serves
          without the validated chat template and tool parser, and participants learn that
          prompt quality cannot fix a tool call nothing parsed. Then the agent calls tools but
          repeats the same call forever, because the harness never inspects the model's stop
          condition.
      - title: "Round 2 — Tool governance with MCP Gateway"
        overview: >-
          The agent calls the wrong tool from a catalog of 18, two of which have overlapping
          descriptions, and returns a plausible wrong answer with no error anywhere.
          Participants put all tool access behind MCP Gateway so the catalog is filtered by
          identity, correct the colliding descriptions, then watch the gateway refuse a
          prompt-injection attempt without ever reading the prompt.
      - title: "Round 3 — Observability with MLflow Tracing"
        overview: >-
          The agent reports success on a summary built from nothing, because a tool returned a
          well-formed empty envelope the model read as valid data. Participants find the
          swallowed failure in the trace, apply a structured error contract of category,
          retryable flag and detail, and add a task-objective verification step so a result
          that returns cleanly but does not satisfy the request is caught before the model
          summarizes it.
      - title: "Round 4 — Enforcement with Guardrails Orchestrator"
        overview: >-
          A compliance rule encoded in the system prompt holds for twenty adversarial cases and
          fails on the twenty-first, because that request asks for an APR range and the rule on
          its own wording covers only an interest rate. Participants split the rule in two and
          enforce each half where it belongs: the content constraint becomes an unconditional
          detector in the TrustyAI Guardrails Orchestrator, and the conditional
          unverified-customer half becomes a Kuadrant AuthPolicy on the rate-lookup tool. They
          then verify deterministic enforcement by re-running the full set through Garak via
          EvalHub and reading the resulting Attack Success Rate.
      - title: "Field wrap and positioning"
        overview: >-
          Discussion-led synthesis converting the four rounds into a customer conversation
          script that maps what a customer describes to the anti-pattern and the Red Hat AI
          capability that addresses it. Also names two failure modes covered by discussion
          rather than hands-on, and closes on why no single published taxonomy contains all
          four of the lab's failures.
    rcars_overlap_pct: 99
    rcars_top_matches:
      - title: "AgentOps in Production — AI Observability on OpenShift"
        ci_name: "published.agentops-ocp.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.agentops-ocp.prod"
        relevance_score: 99
        why_it_fits: >-
          Directly covers MLflow Tracing and multi-agent observability on Red Hat OpenShift AI,
          teaching participants to use distributed traces to diagnose agent failures and silent
          failures. Also addresses MCP and LangGraph agent architectures.
      - title: "LB2144: AI AgentOps OpenShift (AWS)"
        ci_name: "summit-2026.lb2144-agentops-ocp-aws.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb2144-agentops-ocp-aws.prod"
        relevance_score: 93
        why_it_fits: >-
          Covers MLflow Tracing, MCP and multi-agent observability on Red Hat OpenShift AI,
          teaching diagnosis of agent failures from execution traces. The mortgage lending
          scenario provides a regulated-industry context.
      - title: "Agentic AI with Llama Stack and 3rd party Frameworks"
        ci_name: "published.agentic-ai-openshift.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.agentic-ai-openshift.prod"
        relevance_score: 89
        why_it_fits: >-
          Overlapping coverage of vLLM model serving, MCP integration, AI safety guardrails and
          agentic tracing, but built on Llama Stack, LangGraph and Langfuse rather than the
          MLflow Tracing and TrustyAI combination this design uses.
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
