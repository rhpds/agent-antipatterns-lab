  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: classic
  intake_type: new
  automation_type: gitops
  description: "Participants inherit a working agent prototype that fails in production.\
    \ Across four rounds they diagnose a planted anti-pattern \u2014 loop discipline,\
    \ tool governance, observability, and enforcement \u2014 from execution traces,\
    \ then fix it by applying a named Red Hat AI platform component: vLLM tool-calling\
    \ recipes, MCP Gateway, MLflow Tracing, and TrustyAI Guardrails Orchestrator."
  jira_ticket: RHDPCD-1073
  workflow_id: ae352eec-d9fb-4849-b96e-cf7a6a4cf4dc
spec:
  title: "Four Ways Your Agent Fails in Production \u2014 and the Red Hat AI Feature\
    \ That Fixes Each"
  learning_objectives:
  - Analyze an OpenShift AI execution trace to diagnose an agent's runtime behavior
    rather than judging it by its final output.
  - Troubleshoot a model endpoint's tool-calling configuration from an execution trace,
    and explain why a mismatched chat template or tool parser causes an agent to silently
    never call tools.
  - Configure an agent loop to inspect the model's stop condition rather than trusting
    the first response or parsing text for a completion signal.
  - Configure MCP Gateway so an agent is exposed only to the tools its identity authorizes,
    and demonstrate why this stops prompt-injection tool abuse at the infrastructure
    layer.
  - Monitor an agent with MLflow Tracing and use it to locate a failure that the agent
    reported as a success.
  - Implement a structured tool-error contract (error category, retryable flag, detail)
    so that silent tool failures surface instead of becoming confident, empty answers.
  - Migrate a compliance-critical business rule out of a system prompt into the TrustyAI
    Guardrails Orchestrator and gateway authorization policy.
  - Demonstrate the four failure modes and the corresponding Red Hat AI feature in
    a customer conversation.
