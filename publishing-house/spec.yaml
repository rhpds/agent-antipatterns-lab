  environment:
    platform: ocp
    topology: shared-cluster
    cloud_provider: aws
    max_concurrent_users: 30
    ocp_version: '4.20'
    cluster_type: multinode
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 6
    worker_cpu: 16
    worker_ram_gb: 64
    worker_disk_gb: 200
