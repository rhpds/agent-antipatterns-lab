      url: https://catalog.demo.redhat.com/catalog?item=summit-2026.lb2144-agentops-ocp-aws.prod
      relevance_score: 93
      why_it_fits: Covers MLflow Tracing, MCP and multi-agent observability on Red
        Hat OpenShift AI, teaching diagnosis of agent failures from execution traces.
        The mortgage lending scenario provides a regulated-industry context.
