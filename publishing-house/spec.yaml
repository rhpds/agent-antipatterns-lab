    aap_version: ''
    ai_requirement: gpu
    ai_model_tier: open-source
    ai_model_name: RedHatAI/Qwen3-8B-FP8-dynamic
    ai_justification: "MaaS cannot satisfy this lab. Round 1's entire mechanic is\
      \ switching the agent between two serving configurations of the same model \u2014\
      \ one with a mismatched tool-call parser, one with the validated recipe. A hosted\
      \ chat API exposes no serving configuration, so the round has no failure to\
      \ diagnose and no fix to apply. Self-hosted vLLM is therefore required. L40S\
      \ specifically, not A100: the model is an FP8 checkpoint, and native FP8 compute\
      \ (W8A8) requires compute capability 8.9 or later \u2014 Ada Lovelace or Hopper.\
      \ On Ampere (A100, SM80) vLLM does not fail, it silently falls back to weight-only\
      \ W8A16 via FP8 Marlin, dequantizing to 16-bit before the tensor cores. That\
      \ yields the memory saving and none of the FP8 throughput, which is an unacceptable\
      \ trace for a lab whose subject is serving configuration. Sizing is a throughput\
      \ question, not a memory one: after Round 1 the whole room repoints to the validated\
      \ endpoint, so peak concurrent generation lands there. Four GPUs map one vLLM\
      \ instance per GPU \u2014 broken endpoint on GPU 0, three validated replicas\
      \ on GPUs 1-3 \u2014 which avoids per-instance gpu_memory_utilization fractions\
      \ entirely and keeps the failure domain per-endpoint. Public benchmarks show\
      \ Qwen3-8B sustaining 256 concurrent requests on a single A10G with no dropped\
      \ requests; L40S is materially faster with native FP8, so 30 concurrent participants\
      \ across three replicas carries substantial headroom."
    non_ga_products:
    - "MCP Gateway \u2014 Tech Preview via Red Hat Connectivity Link (operator v0.7.1,\
      \ Red Hat provided)"
    - "EvalHub with Garak adversarial-scanning provider \u2014 Tech Preview in RHOAI\
      \ 3.4 and 3.5, no announced GA"
    non_ga_access_plan: "Both ship inside Red Hat OpenShift AI 3.4+ and the TrustyAI\
      \ operator, so no separate entitlement, early-access programme or non-standard\
      \ registry is required \u2014 provisioning installs them through the normal\
      \ operator catalog.\nMCP Gateway carries a documented fallback if its maturity\
      \ regresses before the event: tool scoping at the MCP server/registry level\
      \ plus RBAC, same principle without the gateway dependency. Round 2's identity-based\
      \ tool filtering is a capability of this Tech Preview gateway rather than of\
      \ the Developer Preview MCP catalog or lifecycle operator, neither of which\
      \ this lab uses.\nEvalHub with Garak is Round 4's verification instrument and\
      \ has no equivalent fallback. Its status was investigated rather than assumed:\
      \ it is Tech Preview in both 3.4 and 3.5 with no GA date announced, and the\
      \ Garak provider is being moved from the Llama Stack distribution to the OGX\
      \ distribution between those releases. This lab reaches it through the TrustyAI\
      \ EvalHub CR rather than that distribution, so the rename is not expected to\
      \ break it, but it requires re-verification against the RHOAI version shipping\
      \ at the event. Author decision 2026-08-19: retain Garak on Round 4's critical\
      \ path and disclose Tech Preview status to participants rather than mitigate\
      \ it. Round 4's assessed outcome \u2014 the Guardrails Orchestrator returning\
      \ a blocked verdict \u2014 rests on a component that has been GA since RHOAI\
      \ 2.19, so a Garak regression would cost the quantified Attack Success Rate\
      \ but would not invalidate the round's learning objective."
    external_services:
    - registry.redhat.io
    - quay.io
    - huggingface.co
    - github.com
    - pypi.org
    gpu_nodes: 1
    gpu_type: "NVIDIA L40S 48GB x4 per node (AWS g6e.12xlarge \u2014 4 GPUs, 48 vCPU,\
      \ 384GB RAM)"
