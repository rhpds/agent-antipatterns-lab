spec:
  title: "Four Ways Your Agent Fails in Production — and the Red Hat AI Feature That Fixes Each"
  learning_objectives:
    - "Analyze an OpenShift AI execution trace to diagnose an agent's runtime behavior rather than judging it by its final output."
    - "Troubleshoot a model endpoint's tool-calling configuration from an execution trace, and explain why a mismatched chat template or tool parser causes an agent to silently never call tools."
    - "Configure an agent loop to inspect the model's stop condition rather than trusting the first response or parsing text for a completion signal."
    - "Configure MCP Gateway so an agent is exposed only to the tools its identity authorizes, and demonstrate why this stops prompt-injection tool abuse at the infrastructure layer."
    - "Monitor an agent with MLflow Tracing and use it to locate a failure that the agent reported as a success."
    - "Implement a structured tool-error contract (error category, retryable flag, detail) so that silent tool failures surface instead of becoming confident, empty answers."
    - "Migrate a compliance-critical business rule out of a system prompt into the TrustyAI Guardrails Orchestrator and gateway authorization policy."
    - "Demonstrate the four failure modes and the corresponding Red Hat AI feature in a customer conversation."
  modules:                 # [{id, title, duration_min}] — id is stable (e.g. module-01)
    - id: module-01
      title: "Meet the prototype"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Round 1 — Loop discipline and tool-calling configuration"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Round 2 — Tool governance with MCP Gateway"
      duration_min: 22
      status: not_started
    - id: module-04
      title: "Round 3 — Observability with MLflow Tracing"
      duration_min: 18
      status: not_started
    - id: module-05
      title: "Round 4 — Enforcement with Guardrails Orchestrator"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Field wrap and positioning"
      duration_min: 15
      status: not_started
