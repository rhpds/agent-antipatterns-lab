project:
  slug: "agent-antipatterns-lab"
  owner_email: "davidwil@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "Participants inherit a working agent prototype that fails in production. Across four rounds they diagnose a planted anti-pattern — loop discipline, tool governance, observability, and enforcement — from execution traces, then fix it by applying a named Red Hat AI platform component: vLLM tool-calling recipes, MCP Gateway, MLflow Tracing, and TrustyAI Guardrails Orchestrator."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1073"
  workflow_id: "ae352eec-d9fb-4849-b96e-cf7a6a4cf4dc"

spec:
  title: "Four Ways Your Agent Fails in Production — and the Red Hat AI Feature That Fixes Each"
  learning_objectives:
    - "Analyze an OpenShift AI execution trace to diagnose an agent's runtime behavior rather than judging it by its final output."
    - "Troubleshoot a model endpoint's tool-calling configuration from an execution trace, and explain why a mismatched chat template or tool parser causes an agent to silently never call tools."
    - "Configure an agent loop to inspect the model's stop condition rather than trusting the first response or parsing text for a completion signal."
    - "Configure MCP Gateway so an agent is exposed only to the tools its identity authorizes, and demonstrate why this stops prompt-injection tool abuse at the infrastructure layer."
    - "Monitor an agent with MLflow Tracing and use it to locate a failure that the agent reported as a success."
    - "Implement a structured tool-error contract (error category, retryable flag, detail) so that silent tool failures surface instead of becoming confident, empty answers."
    - "Migrate a compliance-critical business rule out of a system prompt into the TrustyAI Guardrails Orchestrator and gateway authorization policy."
    - "Demonstrate the four failure modes and the corresponding Red Hat AI feature in a customer conversation."
  modules:                 # [{id, title, duration_min}] — id is stable (e.g. module-01)
    - id: module-01
      title: "Meet the prototype"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Round 1 — Loop discipline and tool-calling configuration"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Round 2 — Tool governance with MCP Gateway"
      duration_min: 22
      status: not_started
    - id: module-04
      title: "Round 3 — Observability with MLflow Tracing"
      duration_min: 18
      status: not_started
    - id: module-05
      title: "Round 4 — Enforcement with Guardrails Orchestrator"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Field wrap and positioning"
      duration_min: 15
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster" # shared-cluster | per-student | cnv-pool
    cloud_provider: aws        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 30   # planning cap; sized on peak concurrent generation, not model footprint

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3    # 1 if sno, 3 if multinode
    control_plane_cpu: 16              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64           # 128 if sno, 64 if multinode
    worker_count: 6                    # number of OCP worker nodes
    worker_cpu: 16                     # vCPU per worker
    worker_ram_gb: 64                  # RAM per worker in GB
    worker_disk_gb: 200                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products — N/A, AAP not in product list
    ai_requirement: "gpu"              # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "RedHatAI/Qwen3-8B-FP8-dynamic"
    ai_justification: >-
      MaaS cannot satisfy this lab. Round 1's entire mechanic is switching the agent between two
      serving configurations of the same model — one with a mismatched tool-call parser, one with
      the validated recipe. A hosted chat API exposes no serving configuration, so the round has
      no failure to diagnose and no fix to apply. Self-hosted vLLM is therefore required.
      L40S specifically, not A100: the model is an FP8 checkpoint, and native FP8 compute (W8A8)
      requires compute capability 8.9 or later — Ada Lovelace or Hopper. On Ampere (A100, SM80)
      vLLM does not fail, it silently falls back to weight-only W8A16 via FP8 Marlin, dequantizing
      to 16-bit before the tensor cores. That yields the memory saving and none of the FP8
      throughput, which is an unacceptable trace for a lab whose subject is serving configuration.
      Sizing is a throughput question, not a memory one: after Round 1 the whole room repoints to
      the validated endpoint, so peak concurrent generation lands there. Four GPUs map one vLLM
      instance per GPU — broken endpoint on GPU 0, three validated replicas on GPUs 1-3 — which
      avoids per-instance gpu_memory_utilization fractions entirely and keeps the failure domain
      per-endpoint. Public benchmarks show Qwen3-8B sustaining 256 concurrent requests on a single
      A10G with no dropped requests; L40S is materially faster with native FP8, so 30 concurrent
      participants across three replicas carries substantial headroom.
    non_ga_products:                   # list of non-GA products/versions
      # Maturity questions resolved against primary Red Hat documentation 2026-08-19.
      - "MCP Gateway — Tech Preview via Red Hat Connectivity Link (operator v0.7.1, Red Hat provided)"
      - "EvalHub with Garak adversarial-scanning provider — Tech Preview in RHOAI 3.4 and 3.5, no announced GA"
      # NOT non-GA on this lab's delivery path: vLLM tool-calling configuration. The Developer
      # Preview notice attaches to standalone RHAIIS, not to RHOAI/KServe, where the flags are
      # documented serving-runtime arguments in GA procedures. See the design doc maturity table.
    non_ga_access_plan: >-
      Both ship inside Red Hat OpenShift AI 3.4+ and the TrustyAI operator, so no separate
      entitlement, early-access programme or non-standard registry is required — provisioning
      installs them through the normal operator catalog.

      MCP Gateway carries a documented fallback if its maturity regresses before the event: tool
      scoping at the MCP server/registry level plus RBAC, same principle without the gateway
      dependency. Round 2's identity-based tool filtering is a capability of this Tech Preview
      gateway rather than of the Developer Preview MCP catalog or lifecycle operator, neither of
      which this lab uses.

      EvalHub with Garak is Round 4's verification instrument and has no equivalent fallback.
      Its status was investigated rather than assumed: it is Tech Preview in both 3.4 and 3.5
      with no GA date announced, and the Garak provider is being moved from the Llama Stack
      distribution to the OGX distribution between those releases. This lab reaches it through
      the TrustyAI EvalHub CR rather than that distribution, so the rename is not expected to
      break it, but it requires re-verification against the RHOAI version shipping at the event.
      Author decision 2026-08-19: retain Garak on Round 4's critical path and disclose Tech
      Preview status to participants rather than mitigate it. Round 4's assessed outcome — the
      Guardrails Orchestrator returning a blocked verdict — rests on a component that has been
      GA since RHOAI 2.19, so a Garak regression would cost the quantified Attack Success Rate
      but would not invalidate the round's learning objective.
    external_services:                 # named external service dependencies e.g. [github.com]
      - "registry.redhat.io"           # RHOAI and operator component images
      - "quay.io"                      # workbench and MCP server images
      - "huggingface.co"               # Qwen3-8B-FP8-dynamic model weights (unless pre-staged to cluster storage)
      - "github.com"                   # inherited agent prototype repo, cloned into each workbench
      - "pypi.org"                     # Python dependencies for the agent, MCP servers and MLflow client
    gpu_nodes: 1                       # number of GPU nodes (0 = none)
    gpu_type: "NVIDIA L40S 48GB x4 per node (AWS g6e.12xlarge — 4 GPUs, 48 vCPU, 384GB RAM)"
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

