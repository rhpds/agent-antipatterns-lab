approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: 'Trust-based and stated explicitly. Classic Showroom with no solve/validate
      automation to author, so completion is not machine-verified. Each module instead ends
      in a visible, unambiguous result the participant confirms, chosen so it does not depend
      on the model choosing correctly: tool_calls becoming populated where tool-call text had
      been stranded in the response content, a turn count ending well below the iteration cap
      on the model''s own stop condition, a swallowed failure surfacing as a categorized error,
      an answer traceable to a retrieved passage alongside an out-of-corpus question returning
      an explicit miss, and a tool catalog served through the gateway for the agent''s identity.
      Module 1 establishes payload and trace access; module 7 re-runs every earlier failure
      case against the assembled agent and produces a takeaway artifact rather than a system
      state.'
    catalog_gap: 'Rewritten 2026-09-02 after the topic-alignment rejection, and verified against
      the published repositories rather than catalog metadata alone.

      Slot candidates: LB1782, LB2158 and LB1472 all consume a hosted or centrally served model.
      LB1782 states participants consume a centrally-hosted, pre-deployed Granite model via
      MaaS. None configures a serving runtime, so none can teach why tool calls fail to parse,
      which is this design''s largest module.

      Existing catalog assets, checked directly. The closest is the published vLLM Playground
      (showroom-vllm-playground), whose module 3 teaches parser selection including the Qwen-to-Hermes
      pairing, and whose module 4 covers MCP integration. Playground teaches the choice on the
      happy path through a UI checkbox and a parser dropdown defaulting to Auto-detect, decided
      before anything runs. Module 2 here owns the inverse: the choice is already wrong, nothing
      reported it, and the evidence exists only in the request and response payloads. The parser-by-model-family
      reference table is deliberately not reproduced.

      AgentOps in Production (agentops-in-prod-showroom, duplicated in rhai-features-workshop)
      scored 99 percent against the rejected design with observability, metrics, tracing and
      evaluation modules. All of that is removed; MLflow now appears only as the instrument
      for reading a trace. AgentOps in Action (agentops-in-action-workshop) owns identity-aware
      authorization and adversarial testing in the neighbouring slot; guardrails and adversarial
      scanning are removed and module 6 carries no assessed outcome. Retrieval is bounded to
      one module because LB1782, showroom-agentic-ai-llamastack and enterprise-rag-intel-continuum
      each own it in depth. Red Hat AI Inference (redhat-ai-inference) owns serving lifecycle,
      benchmarking and scale in the Inference slot, which is why this design is framed as building
      an agent rather than as inference.

      rhpds/vllm-tool-calling is a deployment quickstart rather than a lab, providing per-model
      kustomize manifests. It is a reusable provisioning asset, not competing content.

      RCARS re-run 2026-09-02 against the reworked design returned 39 candidates. The top match
      is 99 percent, the same headline figure the previous design carried, but against a different
      asset and for a different reason. Previously it was an agent-operations lab whose entire
      subject this design was duplicating. Now it is a 360-minute Llama Stack lab that shares
      retrieval and MCP connection, both of which are bounded here to one short module each,
      and that does not teach serving configuration at all. The score should be read alongside
      that check: RCARS relevance is AI-generated, its summary for the top match asserts vLLM
      tool-call configuration coverage, and the repository shows no such module. The second
      match, VLLM Playground at 90, is the genuine overlap and is bounded explicitly in the
      module 2 outline.'
    design_overview: 'Participants build a multi-step field service parts agent on OpenShift
      AI one layer at a time, set at a fictional industrial chiller manufacturer so that no
      module can be answered from training data. Each layer opens with that layer failing in
      a way that raises no error, is diagnosed from the evidence rather than the answer, and
      closes with the build step that prevents it: a serving runtime whose parser matches the
      model, a loop that stops on the model''s reported stop condition, tool returns that can
      express failure, a searchable knowledge source, and tool access routed through the platform.
      The order is forced by dependency for the early modules and by weight for the later ones.'
    module_summaries:
    - title: What you are building, and how to see inside it
      overview: Participants meet the agent they will build and establish the habit the lab
        depends on. They run it once, get a confident invented answer, and learn to read the
        request and response payloads and the resulting trace rather than the answer. Nothing
        is built; the output is a habit and a baseline.
    - title: 'The model interface: making tool calls fire at all'
      overview: The agent declared tools and called none. Strengthening the prompt changes nothing.
        The model did emit a correct tool call and the parser configured on the endpoint did
        not match it, so the call was left in the response body as text with no error raised.
        Participants compare the two class endpoints, find the single differing serving argument,
        repoint, and watch tool_calls populate. This is the layer no other candidate in the
        slot teaches.
    - title: 'The agent loop: stop conditions and turn control'
      overview: The agent now calls the same tool repeatedly until the iteration cap. The supplied
        loop never appends tool results to the conversation and never reads why the model stopped,
        so the repetition is caused by code rather than by the model. Participants fix both
        defects and the run terminates on the model's own stop condition.
    - title: Tool returns that tell the truth
      overview: A tool asked for something it cannot supply returns a well-formed empty envelope
        with a 200 status, and the model reads it as valid data meaning nothing found. Participants
        replace the return shape with a contract of category, retryable flag and detail, so
        failure becomes representable and the later layers become debuggable.
    - title: Giving the agent knowledge it can search
      overview: Asked something outside its training data the agent invents a plausible answer
        rather than admitting the gap. Participants add a retrieval tool over a pre-populated
        corpus so answers come from retrieved passages with source identifiers. Because the
        error contract already exists, a retrieval miss returns an explicit gap instead of an
        invention.
    - title: Connecting tools through the platform
      overview: 'Tools are hardcoded into the agent, so adding one means editing, rebuilding
        and redeploying it in every environment. Participants point the agent at MCP Gateway
        so it discovers tools at runtime, then register a new tool at the gateway and watch
        the agent pick it up with no code change or restart. Teaches connection only: no identity,
        filtering or authorization, which the neighbouring lab owns.'
    - title: 'Running it for real: verification and field positioning'
      overview: Every layer was verified alone and none against all the others. Participants
        re-run the full set of earlier failure cases against the assembled agent, record a baseline
        in MLflow, and convert the build into a symptom-to-layer checklist for customer conversations,
        naming the two failure modes covered by discussion rather than hands-on.
    rcars_overlap_pct: 99
    rcars_top_matches:
    - title: Agentic AI with Llama Stack and 3rd party Frameworks
      ci_name: published.agentic-ai-openshift.prod
      url: https://catalog.demo.redhat.com/catalog?item=published.agentic-ai-openshift.prod
      relevance_score: 99
      why_it_fits: 'Re-run 2026-09-02 against the reworked design. RCARS scores it 99 and its
        generated summary claims it covers vLLM model serving with tool-call configuration.
        That claim was checked against the repository (showroom-agentic-ai-llamastack) rather
        than accepted: its 14 modules are introduction, llamastack, exploring-llamastack, RAG,
        evals, shields, web-search, backend-setup, mcp, agent-llamastack, agent-langgraph, langfuse,
        langflow and workbench. There is no serving-configuration module, so it does not teach
        why a mismatched tool-call parser strands a call in the response body, which is this
        lab''s largest block. It is also 360 minutes against this lab''s 120, and is built on
        Llama Stack, now renamed OGX and being de-emphasized. Genuine overlap is retrieval and
        MCP connection, both deliberately bounded here to one short module each.'
    - title: VLLM Playground
      ci_name: agd-v2.vllm-playground-aws.prod
      url: https://catalog.demo.redhat.com/catalog?item=agd-v2.vllm-playground-aws.prod
      relevance_score: 90
      why_it_fits: 'The closest real overlap, and it scored higher on re-run than the 74 recorded
        against the previous design. Its module 3 teaches tool-call parser selection including
        the Qwen-to-Hermes pairing this lab uses, and its module 4 covers MCP integration. Verified
        from the repository: it teaches the choice on the happy path through a web UI checkbox
        and a parser dropdown defaulting to Auto-detect, with a parser-by-model-family reference
        table, all decided before anything runs. Module 2 here owns the inverse case, where
        the choice is already wrong, nothing reports it, and the evidence exists only in the
        request and response payloads. The parser reference table is deliberately not reproduced.
        The two are complementary and the boundary is written into the module 2 outline as an
        authoring constraint.'
    - title: Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry
      ci_name: published.openshift-mcp-lab.prod
      url: https://catalog.demo.redhat.com/catalog?item=published.openshift-mcp-lab.prod
      relevance_score: 84
      why_it_fits: Covers MCP server operationalization and tool governance at the registry
        level with least-privilege access control and RBAC. Module 6 here is 10 minutes, carries
        one objective, and teaches only that routing tool access through the platform decouples
        tool changes from agent releases. It deliberately teaches no identity, filtering or
        authorization, which is this lab's boundary against both this asset and the neighbouring
        Security/Governance lab.
