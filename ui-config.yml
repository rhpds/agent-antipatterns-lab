---
type: showroom

default_width: 30
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # The participant's workbench, opened on module 1. RHDP names the project
  # <username>-app (automation/gitops/README.md). user-${GUID} is the username
  # observed on an RHDP workshop; check it on each new catalog item.
  - name: Notebook
    url: 'https://rh-ai.${DOMAIN}/notebook/user-${GUID}-app/kestrel-agent/lab/tree/agent-antipatterns-lab/notebooks/module-01-what-you-are-building.ipynb'
  - name: ">_ terminal"
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'
  # No OpenShift AI tab: it shares the Notebook tab's login, and Showroom loads
  # every tab at once, so the two logins collided and the Notebook tab failed.
  # An MLflow tab can go here once its route is settled.
