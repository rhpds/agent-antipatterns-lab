---
- name: "End-to-End Test"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Execute two-participant live acceptance and write module evidence
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/run.py"
          - --output
          - "{{ lab_evidence_dir | default(playbook_dir + '/../.cache/live-e2e') }}"
      changed_when: false
