# Runs the agent's mock-model tests (tests/agent/) on pull requests to dev.
# Modules 5-7 start a throwaway pgvector container with podman; a run where that
# can't start fails rather than skips (see acceptance/lab/checks.feature).
name: agent-tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/agent/requirements.txt
            agent/requirements.txt
            agent/requirements-local.txt

      - name: Install test requirements
        run: python -m pip install -r tests/agent/requirements.txt

      # The runner image ships podman; install it only if a
      # future image drops it, so the module 5-7 tests can start their database.
      - name: Make sure podman is available
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman --version

      # The module 6 gateway tests render the lab's charts. The runner image ships helm;
      # install a pinned, checksummed one only if a future image drops it.
      - name: Make sure helm is available
        run: |
          if ! command -v helm >/dev/null; then
            v=v3.16.2; f=helm-$v-linux-amd64.tar.gz
            curl -sSfLO "https://get.helm.sh/$f" && curl -sSfL "https://get.helm.sh/$f.sha256sum" | sha256sum -c -
            tar xzf "$f" && sudo install linux-amd64/helm /usr/local/bin/helm
          fi
          helm version --short

      # Pull ahead of the tests so a registry hiccup is a clear step failure, not three test errors.
      - name: Pull the bulletin database image
        run: |
          for attempt in 1 2 3; do
            podman pull docker.io/pgvector/pgvector:pg16 && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run the agent tests
        working-directory: tests/agent
        run: python -m pytest -q -rs
