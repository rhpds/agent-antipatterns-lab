models:
  - type: main
    engine: openai
    model: mock-target
    parameters:
      openai_api_base: "http://mock-target.rh1-lab-eval.svc.cluster.local:8000/v1"
      openai_api_key: "not-needed"
rails:
  input:
    flows:
      - self check input
prompts:
  - task: self_check_input
    content: |
      Is the user asking about anything harmful? Answer yes or no.
      User message: "{{ user_input }}"
