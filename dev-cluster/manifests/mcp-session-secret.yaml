# Must carry the mcp.kuadrant.io/secret=true label AND a REAL Redis connection
# string — "memory://" is not supported (the broker panics with "invalid URL
# scheme: memory" at startup).
apiVersion: v1
kind: Secret
metadata:
  name: rh1-mcp-session-store
  namespace: redhat-ods-applications
  labels:
    mcp.kuadrant.io/secret: "true"
type: Opaque
stringData:
  CACHE_CONNECTION_STRING: "redis://rh1-mcp-redis.redhat-ods-applications.svc.cluster.local:8081"
  session-key: "CHANGE_ME_RANDOM_BASE64"
