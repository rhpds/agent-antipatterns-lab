# Deployed into redhat-ods-applications, NOT rh1-lab-eval: the shared
# data-science-gateway Gateway only accepts HTTPRoutes from openshift-ingress
# and redhat-ods-applications (enforced by a namespace label selector on the
# Gateway's listener). An MCP backend in an arbitrary project namespace can
# never be reached through it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh1-mcp-server
  namespace: redhat-ods-applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh1-mcp-server
  template:
    metadata:
      labels:
        app: rh1-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/mcp-server.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: rh1-mcp-server-script
---
apiVersion: v1
kind: Service
metadata:
  name: rh1-mcp-server
  namespace: redhat-ods-applications
spec:
  selector:
    app: rh1-mcp-server
  ports:
    - port: 8080
      targetPort: 8080
