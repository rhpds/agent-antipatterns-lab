{{- if .Values.pgvector.enabled }}
{{- $p := .Values.pgvector }}
{{- $ns := printf "%s-app" .Values.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pgvector
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  POSTGRES_DB: {{ $p.database | quote }}
  POSTGRES_USER: {{ $p.user | quote }}
  POSTGRES_PASSWORD: {{ $p.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-init
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  00-pgvector.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgvector
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Lets the pod run as the image's fixed postgres UID (restricted-v2 would force an
# arbitrary UID that has no /etc/passwd entry, which breaks initdb).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgvector-nonroot-v2
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: pgvector
    namespace: {{ $ns }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $p.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      serviceAccountName: pgvector
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $p.runAsUser }}
        fsGroup: {{ $p.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $p.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: pgvector
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgvector-data
        - name: init
          configMap:
            name: pgvector-init
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: pgvector
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
