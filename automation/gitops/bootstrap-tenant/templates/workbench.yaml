{{- define "workbench.pgEnv" }}
{{- if .Values.pgvector.enabled }}
- name: PGHOST
  value: pgvector
- name: PGPORT
  value: "5432"
- name: PGDATABASE
  valueFrom: {secretKeyRef: {name: pgvector, key: POSTGRES_DB}}
- name: PGUSER
  valueFrom: {secretKeyRef: {name: pgvector, key: POSTGRES_USER}}
- name: PGPASSWORD
  valueFrom: {secretKeyRef: {name: pgvector, key: POSTGRES_PASSWORD}}
{{- end }}
{{- end }}
{{- if .Values.workbench.enabled }}
{{- $w := .Values.workbench }}
{{- $ns := printf "%s-app" .Values.username }}
{{- $image := printf "image-registry.openshift-image-registry.svc:5000/%s/%s:%s" $w.image.namespace $w.image.stream $w.image.tag }}
{{- $src := "/opt/app-root/src" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $w.name }}-storage
  namespace: {{ $ns }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ printf "%s storage" $w.displayName | quote }}
    # Same wave as the Notebook that mounts it (see pgvector-data: a WaitForFirstConsumer
    # claim in an earlier wave never turns Healthy, so the sync never reaches its pod).
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $w.storageSize }}
---
# Same shape as the Notebook the OpenShift AI 3.5 dashboard creates
# (odh-dashboard frontend/src/api/k8s/notebooks.ts, assembleNotebook), plus an
# init container that pre-clones the lab repo and installs the agent's packages.
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: {{ $w.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $w.name }}
    opendatahub.io/odh-managed: "true"
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ $w.displayName | quote }}
    notebooks.opendatahub.io/last-image-selection: {{ printf "%s:%s" $w.image.stream $w.image.tag | quote }}
    notebooks.opendatahub.io/inject-auth: "true"
    opendatahub.io/image-display-name: {{ $w.image.displayName | quote }}
    opendatahub.io/username: {{ .Values.username | quote }}
    {{- if .Values.rbac.mlflow }}
    # OpenShift AI's own MLflow integration, as the dashboard sets it. The notebook
    # webhook injects MLFLOW_TRACKING_URI (the Gateway's /mlflow URL),
    # MLFLOW_TRACKING_AUTH=kubernetes-namespaced (service-account token plus the
    # namespace as workspace) and MLFLOW_K8S_INTEGRATION; the controller binds the
    # workbench's service account to mlflow-operator-mlflow-integration. Without this
    # annotation the webhook removes any MLFLOW_TRACKING_URI set here.
    opendatahub.io/mlflow-instance: {{ .Values.mlflow.instance | quote }}
    {{- end }}
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # The notebook webhook adds a container, env and volumes that Argo CD sees as drift.
    # The Argo CD instance should ignore them (ocp4_workload_openshift_gitops_ignore_differences),
    # or the tenant Application stays OutOfSync and RHDP's provisioning stalls ~10 minutes on
    # its Synced wait; see automation/gitops/README.md.
spec:
  template:
    spec:
      enableServiceLinks: false
      initContainers:
        # Runs on every start but only clones and installs once: the results live on
        # the workbench PVC. The agent's virtualenv sees the image's own packages (mlflow,
        # psycopg) and adds only what the image lacks; the image's Python runs JupyterLab.
        - name: lab-setup
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          workingDir: {{ $src }}
          env:
            - name: LAB_REPO_URL
              value: {{ $w.repo.url | quote }}
            - name: LAB_REPO_REF
              value: {{ required "labRepoRef is required: the branch this environment clones (its catalog branch: test or main; dev for a dev environment)" .Values.labRepoRef | quote }}
            {{- include "workbench.pgEnv" . | nindent 12 }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              repo={{ $src }}/{{ $w.repo.dir }}
              venv={{ $src }}/.venv
              # Keep a clone only once it is known good: clone into a temporary directory
              # on the PVC, check it holds the agent, then rename it into place. The rename
              # is on the same filesystem, so a pod killed at any point leaves $repo either
              # absent or whole. A wrong ref fails here with a clear message, and heals
              # once the ref is fixed.
              if [ ! -f "$repo/agent/requirements.txt" ]; then
                # A pod killed during the clone gets SIGKILL (this script is PID 1 and
                # ignores SIGTERM), so the EXIT trap never ran: clear what it left.
                rm -rf -- {{ $src }}/.lab-clone.*
                tmp=$(mktemp -d -p {{ $src }} .lab-clone.XXXXXX)
                trap 'rm -rf "$tmp"' EXIT
                git clone --depth 1 --branch "$LAB_REPO_REF" "$LAB_REPO_URL" "$tmp/repo"
                if [ ! -f "$tmp/repo/agent/requirements.txt" ]; then
                  echo "lab-setup: $LAB_REPO_URL at '$LAB_REPO_REF' has no agent/requirements.txt;" \
                    "set labRepoRef to a branch or tag that contains the agent" >&2
                  exit 1
                fi
                # Move an earlier unusable clone aside rather than deleting it.
                if [ -e "$repo" ]; then mv "$repo" "$repo.unusable.$(date +%s)"; fi
                mv "$tmp/repo" "$repo"
                # Remove the now-empty temporary directory here, not only in the EXIT trap:
                # a pod killed during the pip install below would otherwise leave it, and
                # with $repo whole the cleanup above never runs again.
                rmdir "$tmp"
              fi
              if [ ! -f "$venv/.lab-installed" ]; then
                python3 -m venv "$venv"
                # The image's Python is itself a virtualenv (/opt/app-root), so
                # --system-site-packages would expose /usr's packages, not the image's. A .pth
                # file adds the image's site-packages after the venv's own.
                python3 -c 'import sysconfig; p = sysconfig.get_paths(); print("\n".join(dict.fromkeys([p["purelib"], p["platlib"]])))' \
                  > "$("$venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/workbench-image.pth"
                "$venv/bin/pip" install --no-cache-dir --quiet {{ with $w.pipIndexUrl }}--index-url {{ . }} {{ end }}\
                  -r "$repo/agent/requirements.txt"
                touch "$venv/.lab-installed"
              fi
              {{- if .Values.pgvector.enabled }}
              # Module 5's corpus: load it into this namespace's pgvector if it isn't there
              # yet. pgvector may still be starting (Argo CD syncs it one wave earlier, but a
              # plain apply starts both together), so wait up to 3 minutes for it, and give
              # the load itself 5. Never block the workbench on it: on failure say how to
              # load it by hand and carry on.
              if ! LAB_AGENT_DIR="$repo/agent" "$venv/bin/python" - <<'PY'
              import os, subprocess, sys, time
              import psycopg
              deadline = time.monotonic() + 180
              while True:
                  try:
                      conn = psycopg.connect(connect_timeout=5)
                      break
                  except psycopg.OperationalError:
                      if time.monotonic() > deadline:
                          sys.exit("lab-setup: pgvector did not accept connections within 3 minutes")
                      time.sleep(5)
              with conn:
                  loaded = (conn.execute("SELECT to_regclass('bulletins') IS NOT NULL").fetchone()[0]
                            and conn.execute("SELECT count(*) FROM bulletins").fetchone()[0] > 0)
              if loaded:
                  print("lab-setup: module 5 corpus already loaded")
              else:
                  subprocess.run([sys.executable, "ingest_corpus.py"], cwd=os.environ["LAB_AGENT_DIR"],
                                 check=True, timeout=300)
              PY
              then
                echo "lab-setup: module 5's corpus is not loaded; load it from a terminal with:" \
                  "cd ~/{{ $w.repo.dir }}/agent && python ingest_corpus.py" >&2
              fi
              {{- end }}
          volumeMounts:
            - name: {{ $w.name }}-storage
              mountPath: {{ $src }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
      containers:
        - name: {{ $w.name }}
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          workingDir: {{ $src }}
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ $ns }}/{{ $w.name }}
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: {{ $image }}
            # Terminals find the agent's virtualenv first; JupyterLab itself keeps the
            # image's Python because the virtualenv has no jupyter.
            - name: PATH
              value: {{ $src }}/.venv/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            {{- include "workbench.pgEnv" . | nindent 12 }}
            {{- if .Values.mcpGateway.enabled }}
            - name: LAB_GATEWAY_URL
              value: {{ required "mcpGateway.url is required when mcpGateway.enabled" .Values.mcpGateway.url | quote }}
            {{- end }}
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /notebook/{{ $ns }}/{{ $w.name }}/api
              port: notebook-port
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              scheme: HTTP
              path: /notebook/{{ $ns }}/{{ $w.name }}/api
              port: notebook-port
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          volumeMounts:
            - name: {{ $w.name }}-storage
              mountPath: {{ $src }}
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: {{ $w.name }}-storage
          persistentVolumeClaim:
            claimName: {{ $w.name }}-storage
        - name: shm
          emptyDir:
            medium: Memory
{{- end }}
