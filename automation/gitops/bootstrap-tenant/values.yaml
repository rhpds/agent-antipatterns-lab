deployer:
  domain: apps.example.com

username: user1

# Must match bootstrap-infra modelServing.namespace / rhoai.applicationsNamespace.
modelServing:
  # Binds the user read-only to the shared serving namespace (module 2: compare endpoints).
  access: true
  namespace: llm-serving

# RBAC for the workbench (Notebook CR) and MLflow tracking (module 1/7).
# lab-user covers the participant's own identity; the workbench's service account gets
# MLflow access from OpenShift AI's integration (see templates/workbench.yaml).
rbac:
  workbench: true
  # Also sets the workbench Notebook's opendatahub.io/mlflow-instance annotation, which
  # turns on OpenShift AI's MLflow integration for it.
  mlflow: true

# Module 6: the lab's MCP Gateway (bootstrap-infra mcpGateway). The workbench gets its address in
# LAB_GATEWAY_URL, and its service account may create the one ConfigMap that registers a tool
# for this participant. The url is the lab gateway's in-cluster address (it has no public one),
# which bootstrap-infra uses as the MCP host (see its mcpGateway.gateway and publicHost); keep
# the two in step.
mcpGateway:
  enabled: true
  url: "https://lab-mcp-gateway-lab-mcp-gateway-class.openshift-ingress.svc.cluster.local/mcp"
  registrationConfigMap: kestrel-tool-registrations

# The MLflow CR name the workbench's opendatahub.io/mlflow-instance annotation points at.
mlflow:
  instance: mlflow

# The participant's workbench, with the lab repo pre-cloned and the agent's packages
# installed into ~/.venv on first start.
workbench:
  enabled: true
  name: kestrel-agent
  displayName: Kestrel agent
  # Stock OpenShift AI image: Jupyter Data Science, CPU, Python 3.12. It ships mlflow 3.14.0
  # (the lab's MLflow server version) and psycopg 3.3.4, so lab-setup only adds openai.
  image:
    namespace: redhat-ods-applications
    stream: s2i-generic-data-science-notebook
    tag: "3.5"
    displayName: Jupyter | Data Science | CPU | Python 3.12
  repo:
    url: https://github.com/rhpds/agent-antipatterns-lab.git
    # A branch or tag (git clone --branch takes no commit SHA). main does not hold agent/
    # until dev is released to it; switch this to main as part of that release.
    ref: dev
    dir: agent-antipatterns-lab
  # Where agent/requirements.txt is installed from. Empty = the image's own pip.conf, Red
  # Hat's OpenShift AI index (packages.redhat.com/api/pypi/public-rhai/rhoai/3.5/cpu-ubi9).
  pipIndexUrl: ""
  storageSize: 5Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

# Module 5 vector store: pgvector Postgres as a plain Deployment (no operator).
pgvector:
  enabled: true
  # TODO: Docker Hub image; 30 simultaneous pulls risk rate limits. Mirror it (for example
  # to quay.io) and point this at the mirror, then swap docker.io for the mirror's registry
  # in spec.yaml external_services and design.md.
  image: docker.io/pgvector/pgvector:pg16
  database: kestrel
  user: kestrel
  # Lab-only credential for invented data; a NetworkPolicy limits access to the user's namespace.
  password: kestrel-lab
  storageSize: 2Gi
  # UID of the postgres user in the image; run under nonroot-v2 SCC.
  runAsUser: 999
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
