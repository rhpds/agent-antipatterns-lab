# The branch (or tag) of this repo that the environment clones at run time: the branch its
# catalog item deploys from, test for the test environment and main for the event (David,
# 2026-11-02, #88). The catalog passes it alongside the branch it deploys, for example
#   labRepoRef: "{{ ocp4_workload_gitops_bootstrap_repo_revision }}"
# Dev environments set dev in their values file. No default: an environment that doesn't
# say its branch fails to render rather than quietly cloning dev.
labRepoRef: ""

deployer:
  domain: apps.example.com

# ---------------------------------------------------------------------------
# Sync-wave map (ArgoCD). Lower runs first.
#   -20  namespaces, OperatorGroups, wait-job ServiceAccount/RBAC
#   -15  operator Subscriptions
#   -10  Job: wait for every enabled operator CSV to reach Succeeded
#     0  NodeFeatureDiscovery CR, DSCInitialization
#     1  NVIDIA ClusterPolicy, Kuadrant CR
#     2  DataScienceCluster
#     3  Job: wait for platform (DSC Ready, MLflow CRD, Gateway, GPUs allocatable)
#     4  MLflow + Route, model-serving namespace + ServingRuntimes,
#        MCP Gateway prerequisites (Redis, session Secret, NetworkPolicy, ReferenceGrant)
#     5  InferenceServices, MCP backend + HTTPRoute
#     6  MCPGatewayExtension
#     7  MCPServerRegistration
#     8  MCPVirtualServer
# All CRs carry SkipDryRunOnMissingResource because their CRDs arrive with the
# operators installed earlier in the same sync.
# ---------------------------------------------------------------------------

bootstrap:
  # Namespace for the wait Jobs and their ServiceAccount.
  namespace: lab-bootstrap
  # `cli` ImageStream ships in every OpenShift cluster (openshift namespace).
  cliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  waitForOperators:
    enabled: true
    timeoutSeconds: 900
  waitForPlatform:
    enabled: true
    timeoutSeconds: 1800

# Operator catalog defaults. Channels are ASSUMPTIONS to verify on the target
# cluster: `oc get packagemanifest <name> -o jsonpath='{.status.channels[*].name}'`
operators:
  certManager:
    enabled: true            # RHOAI 3.x KServe prerequisite
    namespace: cert-manager-operator
    name: openshift-cert-manager-operator
    channel: stable-v1
    source: redhat-operators

nfd:
  # Installed only when gpu.enabled=true.
  namespace: openshift-nfd
  name: nfd
  channel: stable
  source: redhat-operators

gpu:
  # Master switch for NFD + NVIDIA GPU Operator + model serving.
  # Set false on a CPU-only cluster (e.g. the homelab SNO).
  enabled: true
  namespace: nvidia-gpu-operator
  name: gpu-operator-certified
  # Pinned to the catalog default verified on Dev CI (OCP 4.22) and the SNO.
  # "stable" also exists but floats; pin so a catalog bump can't change the lab.
  channel: v26.7
  source: certified-operators
  # Wait-job gate: block the platform wait until at least one node advertises
  # nvidia.com/gpu allocatable.
  waitForAllocatable: true

rhoai:
  # OpenShift AI is present; everything that builds on it (model serving, MLflow,
  # MCP Gateway, the platform waits) depends on this.
  enabled: true
  # Whether this chart installs OpenShift AI itself: the operator Subscription,
  # DSCInitialization and DataScienceCluster. Set false when the RHDP ai_workloads role
  # installs it (values-ai-workloads.yaml); the chart then builds on that install.
  install: true
  # DataScienceCluster components the lab needs Managed, checked by wait-for-platform
  # whoever installed OpenShift AI (mlflowoperator is added when mlflow.enabled).
  requiredComponents: [dashboard, workbenches, kserve]
  namespace: redhat-ods-operator
  name: rhods-operator
  channel: stable-3.5
  source: redhat-operators
  applicationsNamespace: redhat-ods-applications
  # KServe runs in RawDeployment mode (the only mode in 3.x), so no
  # Serverless / Service Mesh operators are installed.
  kserveRawServiceConfig: Headless

mlflow:
  enabled: true
  # MLflow CR is a cluster singleton: the name MUST be literally "mlflow" and
  # it always lands in the RHOAI applications namespace.
  # RHOAIENG-45969: serveArtifacts/artifactsDestination must be set explicitly
  # or log_artifact() fails.
  backendStoreUri: "sqlite:////mlflow/data/mlflow.db"
  artifactsDestination: "file:///mlflow/data/artifacts"
  storageSize: 20Gi
  replicas: 1
  # Empty = operator defaults (fine on a real multi-node cluster). The homelab
  # SNO needed requests tuned down; override there, not here.
  resources: {}
  # RHOAIENG-44516 workaround: Gateway rejects k8s tokens, so expose a Route
  # directly to the Service. Clients must send `X-MLflow-Workspace: <namespace>`.
  directRoute:
    enabled: true

modelServing:
  # Requires gpu.enabled=true. Two vLLM endpoints of the SAME model on one
  # 4x L40S node: one deliberately mismatched, one validated (3 replicas).
  enabled: true
  namespace: llm-serving
  model: RedHatAI/Qwen3-8B-FP8-dynamic
  # Red Hat's ModelCar image of `model`, pulled from registry.redhat.io with the cluster
  # pull secret and mounted at /mnt/models: no Hugging Face download or rate limits, and
  # cached per node. Pinned by digest so every cluster serves identical weights.
  # Unset it to download `model` from huggingface.co instead.
  # Provenance: the RHEL AI namespace (rhelai1), behind its `1.5` tag; there is no
  # rhaii/ or rhoai/ variant. The digest is the amd64 image manifest (the GPU nodes'
  # architecture), not the multi-arch list, on purpose.
  storageUri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic@sha256:18e270991d1e8d19035891719d15497f51ef9e7907854180f0d7fd010b2a5b71
  # Must equal the "model" the agent sends (agent/config.toml, spec.yaml ai_model_name);
  # vLLM 404s any other name. Defaults to `model` when unset.
  servedModelName: RedHatAI/Qwen3-8B-FP8-dynamic
  # The image OpenShift AI 3.5.1 pins in its vllm-cuda-runtime-template
  # (redhat-ods-applications). The rhaii repo publishes no `latest` tag.
  image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
  maxModelLen: 32768
  gpuMemoryUtilization: "0.90"
  seed: 0
  # Greedy decoding enforced server-side so all participants see identical content and
  # tool_calls. Qwen3's separate reasoning text can still differ between identical requests.
  overrideGenerationConfig: '{"temperature":0,"top_p":1,"top_k":-1}'
  # Identical on both endpoints; must never be the difference between them.
  reasoningParser: qwen3
  resources:
    requests:
      cpu: "6"
      memory: 24Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "10"
      memory: 40Gi
      nvidia.com/gpu: "1"
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # The ONLY per-endpoint difference is toolCallParser (and replica count).
  # Names are deliberately neutral: module 1 must not reveal which one is broken.
  # GPU "0 vs 1-3" is expressed by count (1 + 3 = 4 GPUs); the device plugin
  # does not let a pod choose a specific GPU index.
  endpoints:
    - name: qwen3-8b-a        # module 1 starting endpoint (the mismatched one)
      displayName: Qwen3 8B class endpoint A
      # The deliberately mismatched parser. Verified on OpenShift AI 3.5.1 (vLLM in
      # rhaii/vllm-cuda-rhel9, 2026-10-13): pythonic returns 200 with tool_calls null
      # and Qwen3's <tool_call> block left in `content`. llama3_json does not work
      # here: it fails every request with HTTP 500 because Qwen3's tokenizer has no
      # <|python_tag|> token.
      toolCallParser: pythonic
      replicas: 1
    - name: qwen3-8b-b        # validated recipe
      displayName: Qwen3 8B class endpoint B
      toolCallParser: hermes
      replicas: 3

mcpGateway:
  # Tech Preview, supporting only. Set false to skip entirely.
  enabled: true
  namespace: lab-mcp                     # the broker, Redis and the tool server; the only namespace the Gateway admits
  createNamespace: true                  # false if the namespace already exists and is managed elsewhere
  operatorNamespace: mcp-system          # Kuadrant CR namespace as verified on the SNO
  operators:
    - name: rhcl-operator                # Red Hat Connectivity Link; pulls in Authorino + Limitador
      channel: stable
      source: redhat-operators
      enabled: true
    # MCP Gateway operator. Package/channel verified in the packagemanifests on
    # both the SNO and Dev CI: only a "preview" channel exists (Tech Preview).
    - name: mcp-gateway
      channel: preview
      source: redhat-operators
      enabled: true
  # The lab's own Gateway (created when create is true). Never point this at OpenShift AI's
  # data-science-gateway: the extension's filter runs first on every request through its
  # Gateway, and there it returned 404 for MLflow, the dashboard and workbenches (2026-11-02).
  gateway:
    create: true
    name: lab-mcp-gateway
    className: lab-mcp-gateway-class
    namespace: openshift-ingress
    sectionName: https
  # The MCP host, used both by participants' agents (LAB_GATEWAY_URL) and by the broker when
  # it hair-pins backend calls back through the Gateway. Empty = the Gateway's in-cluster
  # address, <gateway.name>-<gateway.className>.<gateway.namespace>.svc.cluster.local, which is
  # what the Gateway publishes in its status and the only name its service-CA certificate is
  # valid for. The gateway has no public address: the agent runs in the workbench, inside the
  # cluster. Seen with OpenShift AI's Gateway on 3.5.2 and mcp-gateway v0.7.1, 2026-11-02, and
  # still true of any Gateway here: a public route name fails the broker's hair-pin TLS
  # ("certificate is valid for ...svc") and every tools/call returns HTTP 500, and the
  # operator's default hair-pin address, <gateway>-istio.<ns>.svc, doesn't exist.
  publicHost: ""
  # Where the broker's router opens tools/call sessions. Its default hair-pins back through the
  # Gateway (https://<publicHost>:443), but in mcp-gateway v0.7.1 the router verifies that TLS
  # against the system trust store only, which lacks OpenShift's service CA ("x509: certificate
  # signed by unknown authority"); the registration's caCertSecretRef doesn't help, because it
  # configures TLS to the tool server itself (and then breaks discovery of a plain-HTTP server).
  # With the lab's single backend, the router goes straight to the tool server's in-cluster
  # service. The tool server authenticates callers itself, with a TokenReview of the bearer
  # token the broker passes on. Empty = hair-pin through the Gateway.
  privateHost: "http://mcp-server.lab-mcp.svc.cluster.local:8080"
  toolPrefix: "kestrel_"
  # Redis session store: must be a real Redis (memory:// panics the broker), with
  # protected-mode off. 8081 because redhat-ods-applications' NetworkPolicy blocks 6379.
  redis:
    image: registry.redhat.io/rhel9/redis-7:latest
    port: 8081
  # Session key. Empty = deterministic value derived from deployer.domain so
  # Argo does not see drift on every render. Override via a sealed/real Secret
  # for anything that is not a throwaway lab.
  sessionKey: ""
  # The lab's tool server (files/lab-tool-server.py): the agent's own module 5 tools, cloned
  # from the lab repo at startup, plus estimate_delivery for participants who register it
  # (module 6). Each caller gets their own tool list (userSpecificList), so one participant
  # registering doesn't change another's catalog.
  server:
    enabled: true
    image: registry.access.redhat.com/ubi9/python-311:latest
    # Clones the repo; the workbench image has git (the RHOAI image stream in this namespace).
    cloneImage: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-minimal-notebook:3.5
    repo:
      url: https://github.com/rhpds/agent-antipatterns-lab.git
      # The branch comes from labRepoRef (top of this file).
    path: /lab-mcp-backend
    # The ConfigMap a participant creates in their own project to register a tool.
    registrationConfigMap: kestrel-tool-registrations
    tools:
      - find_part
      - check_stock
      - search_bulletins
      - estimate_delivery
