{{- if include "infra.serving" . }}
{{- $m := .Values.modelServing }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $m.namespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
---
# Read-only view of the serving config so participants can compare endpoints
# (module 2). Bound per user from the bootstrap-tenant chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-serving-viewer
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes", "inferenceservices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
{{- range $m.endpoints }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .name }}
  namespace: {{ $m.namespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ .displayName | quote }}
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  multiModel: false
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: {{ $m.image }}
      command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --port=8080
        {{- if $m.storageUri }}
        # KServe mounts the ModelCar's weights here from storageUri.
        - --model=/mnt/models
        {{- else }}
        - --model={{ $m.model }}
        {{- end }}
        - --served-model-name={{ $m.servedModelName | default $m.model }}
        - --dtype=auto
        - --max-model-len={{ $m.maxModelLen }}
        - --gpu-memory-utilization={{ $m.gpuMemoryUtilization }}
        - --seed={{ $m.seed }}
        - {{ printf "--override-generation-config=%s" $m.overrideGenerationConfig | quote }}
        - --enable-auto-tool-choice
        - --reasoning-parser={{ $m.reasoningParser }}
        # The single deliberate difference between the two endpoints:
        - --tool-call-parser={{ .toolCallParser }}
      env:
        - name: HOME
          value: /tmp
        {{- if not $m.storageUri }}
        - name: HF_HOME
          value: /hf-cache
        # The Red Hat vLLM image defaults to offline mode; --model is a
        # Hugging Face id, so the first start must download it.
        - name: HF_HUB_OFFLINE
          value: "0"
        {{- end }}
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        {{- if not $m.storageUri }}
        - name: hf-cache
          mountPath: /hf-cache
        {{- end }}
      # The first start pulls ~9 GB of weights (the ModelCar image, or huggingface.co
      # without storageUri), so allow a long startup.
      startupProbe:
        httpGet: {path: /health, port: 8080}
        periodSeconds: 10
        failureThreshold: 90
      readinessProbe:
        httpGet: {path: /health, port: 8080}
        periodSeconds: 10
      livenessProbe:
        httpGet: {path: /health, port: 8080}
        periodSeconds: 30
        failureThreshold: 5
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
    {{- if not $m.storageUri }}
    - name: hf-cache
      emptyDir:
        sizeLimit: 40Gi
    {{- end }}
{{- /* KServe RawDeployment runs at least one pod even at minReplicas 0, so
       replicas: 0 leaves the InferenceService out instead. */}}
{{- if gt (int .replicas) 0 }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .name }}
  namespace: {{ $m.namespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ .displayName | quote }}
    serving.kserve.io/deploymentMode: RawDeployment
    # Lab endpoint is cluster-internal and unauthenticated so participants need no token.
    security.opendatahub.io/enable-auth: "false"
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  predictor:
    minReplicas: {{ .replicas }}
    maxReplicas: {{ .replicas }}
    # Each replica holds a whole GPU, so a surge pod waits for a GPU the old pod never
    # frees and the rollout deadlocks on a full node. Replace one replica at a time.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .name }}
      {{- if $m.storageUri }}
      storageUri: {{ $m.storageUri }}
      {{- end }}
      resources:
        {{- toYaml $m.resources | nindent 8 }}
    nodeSelector:
      {{- toYaml $m.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml $m.tolerations | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
