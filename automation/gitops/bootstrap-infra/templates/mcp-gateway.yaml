{{- if and .Values.mcpGateway.enabled .Values.rhoai.enabled }}
{{- $g := .Values.mcpGateway }}
{{- $ns := $g.namespace }}
{{- $host := include "infra.gatewayHost" . }}
---
# Fix 2: operators install Authorino/Limitador but nothing runs until a Kuadrant CR exists.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: {{ $g.operatorNamespace }}
  annotations:
    {{- include "infra.crAnnotations" (dict "wave" 1) | nindent 4 }}
{{- if $g.gateway.create }}
---
# The lab's own Gateway, never OpenShift AI's. The MCPGatewayExtension inserts an ext_proc filter
# FIRST on every request through the Gateway it targets, with failure_mode_allow false. Attached
# to OpenShift AI's data-science-gateway (mcp-gateway v0.7.1, 2026-11-02), that returned 404 for
# MLflow, the dashboard and workbench routes. Here the filter only ever sees MCP traffic.
# ClusterIP only: the agent runs in the workbench, inside the cluster, and the gateway has no
# public address. TLS uses a service-CA certificate, which workbenches already trust.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $g.gateway.className }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controllerName: openshift.io/gateway-controller/v1
---
# Service settings for the Gateway's Envoy: ClusterIP, and the service CA signs its certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $g.gateway.name }}-config
  namespace: {{ $g.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: {{ printf "%s-service-tls" $g.gateway.name | quote }}
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.gateway.name }}
  namespace: {{ $g.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: {{ $g.gateway.className }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $g.gateway.name }}-config
  listeners:
    - name: {{ $g.gateway.sectionName }}
      port: 443
      protocol: HTTPS
      # Only the lab's MCP namespace may attach routes.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ printf "%s-service-tls" $g.gateway.name }}
{{- end }}
---
# Fix 6: Redis on 8081, not 6379. Fixed when the backends lived in redhat-ods-applications, whose
# operator-managed NetworkPolicy only opens 8443/8080/8081/5432/8082/8099/8181/9443; kept so the
# chart still works with that namespace. --protected-mode no is needed or non-loopback clients get
# a misleading "broken pipe".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-redis
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-redis
  template:
    metadata:
      labels:
        app: mcp-redis
    spec:
      containers:
        - name: redis
          image: {{ $g.redis.image }}
          # No snapshots (--save ""): the session store needn't survive a restart, and the image's
          # working directory isn't writable, so a failed snapshot made Redis refuse every write
          # ("MISCONF ... unable to persist to disk") and the router fail every tools/call.
          command: ["redis-server", "--port", {{ $g.redis.port | quote }}, "--protected-mode", "no", "--save", ""]
          ports:
            - containerPort: {{ $g.redis.port }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-redis
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app: mcp-redis
  ports:
    - port: {{ $g.redis.port }}
      targetPort: {{ $g.redis.port }}
---
# Fix 5: needs the mcp.kuadrant.io/secret=true label and a REAL Redis URL
# (memory:// panics the broker with "invalid URL scheme: memory").
apiVersion: v1
kind: Secret
metadata:
  name: mcp-session-store
  namespace: {{ $ns }}
  labels:
    mcp.kuadrant.io/secret: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  CACHE_CONNECTION_STRING: "redis://mcp-redis.{{ $ns }}.svc.cluster.local:{{ $g.redis.port }}"
  session-key: {{ default (sha256sum (printf "%s/mcp-session-key" .Values.deployer.domain)) $g.sessionKey | quote }}
---
# Who may reach the lab's MCP namespace: its own pods (the broker's router opens tools/call
# sessions straight to the tool server), the Gateway's Envoy in {{ $g.gateway.namespace }} (MCP
# traffic, and the broker's gRPC ext_proc port 50051; without that, every CR reports Ready but
# requests 504 with ext_proc_error_per-message_timeout_exceeded, found in Envoy's log, not the
# broker's), and the MCP Gateway controller in {{ $g.operatorNamespace }} (it validates each
# MCPServerRegistration through the broker's status and config ports 8080 and 8181; without it the
# registration stays "Validation failed: ... /status: context deadline exceeded"). Workbenches
# reach the lab only through the Gateway, so Redis and the tool server aren't open to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-mcp-ingress
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.gateway.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $g.operatorNamespace }}
---
# Fix 3: MCPGatewayExtension -> Gateway is cross-namespace and needs a ReferenceGrant
# in the Gateway's namespace. (MCPServerRegistration stays in the same namespace as its
# HTTPRoute so no second grant is needed; the cross-namespace failure mode is a bare
# "HTTPRoute not found".)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-gateway-ext
  namespace: {{ $g.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPGatewayExtension
      namespace: {{ $ns }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $g.gateway.name }}
{{- if $g.server.enabled }}
---
# Fix 1: backends must live in a namespace the Gateway listener admits ({{ $ns }}).
# Fix 8/9 (ping method, tool "id" field) are in files/lab-tool-server.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-script
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  lab-tool-server.py: |
    {{- .Files.Get "files/lab-tool-server.py" | nindent 4 }}
---
# The tool server reads each participant's registration ConfigMap (that one name only) and
# reviews callers' tokens to learn who is asking (system:auth-delegator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-tool-registrations-reader
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $g.server.registrationConfigMap | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-tool-registrations-reader
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-tool-registrations-reader
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-tool-server-token-review
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      initContainers:
        # The agent's own tool code, as participants have it at the start of module 6
        # (module 5's tools.py), so the gateway serves exactly what they built.
        - name: clone
          image: {{ $g.server.cloneImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              git clone --depth 1 --branch {{ $g.server.repo.ref | quote }} {{ $g.server.repo.url | quote }} /src/repo
              cp /src/repo/agent/solutions/module-05/tools.py /src/repo/agent/tools.py
          volumeMounts:
            - name: src
              mountPath: /src
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: mcp-server
          image: {{ $g.server.image }}
          command: ["python3", "/app/lab-tool-server.py"]
          env:
            - name: LAB_AGENT_DIR
              value: /src/repo/agent
            - name: LAB_REGISTRATION_CONFIGMAP
              value: {{ $g.server.registrationConfigMap | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: script
              mountPath: /app
            - name: src
              mountPath: /src
      volumes:
        - name: script
          configMap:
            name: mcp-server-script
        - name: src
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8080
      targetPort: 8080
---
# sectionName must match the MCPGatewayExtension targetRef.sectionName exactly or the
# registration fails validation with no detail.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-server
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $g.gateway.name }}
      namespace: {{ $g.gateway.namespace }}
      sectionName: {{ $g.gateway.sectionName }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-server
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: {{ $g.server.path }}
{{- end }}
---
# Fix 4: spec.publicHost is mandatory; the Gateway listener has no hostname of its own
# ("listener has no hostname and spec.publicHost is not set" otherwise).
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway
  namespace: {{ $ns }}
  annotations:
    {{- include "infra.crAnnotations" (dict "wave" 6) | nindent 4 }}
spec:
  publicHost: {{ $host | quote }}
  privateHost: {{ $g.privateHost | default (printf "https://%s:443" $host) | quote }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $g.gateway.name }}
    namespace: {{ $g.gateway.namespace }}
    sectionName: {{ $g.gateway.sectionName }}
  sessionStore:
    secretName: mcp-session-store
  trustedHeadersKey:
    secretName: mcp-trusted-headers
    generate: Enabled
{{- if $g.server.enabled }}
---
# userSpecificList: the broker asks the tool server for each caller's own tool list (with the
# caller's session headers), so estimate_delivery appears only for a participant who has
# registered it. Fix 9: userSpecificList requires a prefix.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: mcp-server
  namespace: {{ $ns }}
  annotations:
    {{- include "infra.crAnnotations" (dict "wave" 7) | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-server
  path: {{ $g.server.path }}
  userSpecificList: Enabled
  hint: "Kestrel Industrial field service tools: parts, stock, service bulletins, delivery."
  category:
    - lab
  tags:
    - agent-antipatterns-lab
  prefix: {{ $g.toolPrefix | quote }}
---
# Tool names are the UNPREFIXED upstream names; the prefix is applied by the broker.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPVirtualServer
metadata:
  name: lab-catalog
  namespace: {{ $ns }}
  annotations:
    {{- include "infra.crAnnotations" (dict "wave" 8) | nindent 4 }}
spec:
  description: "Lab aggregated tool catalog"
  tools:
    {{- toYaml $g.server.tools | nindent 4 }}
{{- end }}
{{- end }}
